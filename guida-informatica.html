<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guida Pratica — Informatica & Excel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --card:#FFFFFF; --ink:#20242C; --ink-soft:#5B6472; --line:#EAE6DC;
  --base:#2563EB; --base-bg:#EAF1FE;
  --sic:#E11D48; --sic-bg:#FDECEF;
  --mail:#7C3AED; --mail-bg:#F3EDFE;
  --file:#0D9488; --file-bg:#E6F6F4;
  --word:#4F46E5; --word-bg:#EEEDFC;
  --excel:#16A34A; --excel-dark:#0F7A38; --excel-bg:#E9F8EE;
  --ext:#64748B; --ext-bg:#EEF1F4;
  --quiz:#D97706; --quiz-bg:#FDF3E3;
  --amber:#F59E0B; --red:#DC2626;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#181B20; --card:#22262D; --ink:#EDEFF3; --ink-soft:#9AA3B0; --line:#33383F;
    --base-bg:#1A2A46; --sic-bg:#3A1620; --mail-bg:#2A2044; --file-bg:#0F2E2A; --word-bg:#241F45; --excel-bg:#123420; --ext-bg:#2A2E35; --quiz-bg:#3A2A10; }
}
:root[data-theme="dark"]{ --bg:#181B20; --card:#22262D; --ink:#EDEFF3; --ink-soft:#9AA3B0; --line:#33383F;
  --base-bg:#1A2A46; --sic-bg:#3A1620; --mail-bg:#2A2044; --file-bg:#0F2E2A; --word-bg:#241F45; --excel-bg:#123420; --ext-bg:#2A2E35; --quiz-bg:#3A2A10; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{ height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito Sans',ui-sans-serif,system-ui; font-size:15.5px; line-height:1.6; }
h1,h2,h3{ font-family:'Fredoka',ui-sans-serif; font-weight:600; margin:0 0 .5em; }
p{ margin:.3em 0 .9em; max-width:64ch; color:var(--ink-soft); }
b{ color:var(--ink); }
code{ background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 7px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
kbd{ background:var(--ink); color:var(--bg); border-radius:5px; padding:2px 8px; font-size:.8em; font-weight:700; box-shadow:0 2px 0 rgba(0,0,0,.15); }
.chip{ display:inline-block; padding:1px 9px; border-radius:6px; font-weight:700; font-size:.92em; }
.app{ display:flex; min-height:100%; }
nav{ width:220px; flex:none; background:var(--card); border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto; }
nav .brand{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.15rem; padding:2px 6px 14px; }
nav .brand small{ display:block; font-family:'Nunito Sans',sans-serif; font-weight:600; color:var(--ink-soft); font-size:.72rem; margin-top:3px;}
nav button{ display:block; width:100%; text-align:left; background:none; border:none; font:inherit; font-weight:700; color:var(--ink-soft);
  padding:9px 12px; margin:2px 0; cursor:pointer; font-size:.86rem; border-radius:9px; }
nav button .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle; }
nav button:hover{ background:var(--bg); color:var(--ink); }
nav button.active{ color:#fff; }
main{ flex:1; padding:34px 40px 90px; max-width:880px; }
.section{ display:none; } .section.active{ display:block; animation:fade .2s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
.pill{ display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.02em; padding:4px 12px; border-radius:999px; margin-bottom:12px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:12px 0; box-shadow:0 1px 2px rgba(0,0,0,.03); }
ul{ margin:0 0 1em; padding-left:1.2em; color:var(--ink-soft); }
li{ margin-bottom:7px; }
table{ border-collapse:collapse; width:100%; margin:12px 0 20px; font-size:.9rem; }
th,td{ border:1px solid var(--line); padding:8px 11px; text-align:left; }
th{ font-family:'Fredoka',sans-serif; font-weight:600; }
.box{ border-radius:12px; padding:14px 16px; margin:16px 0; border-left:5px solid; }
.box .lbl{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:.85rem; display:block; margin-bottom:4px; }
.box.prova{ background:var(--excel-bg); border-color:var(--excel); }
.box.prova .lbl{ color:var(--excel-dark); }
.box.importante{ background:var(--sic-bg); border-color:var(--sic); }
.box.importante .lbl{ color:var(--sic); }
.box.ricorda{ background:var(--base-bg); border-color:var(--base); }
.box.ricorda .lbl{ color:var(--base); }
.box.esercizio{ background:var(--mail-bg); border-color:var(--mail); }
.box.esercizio .lbl{ color:var(--mail); }
.step{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--excel); border-radius:10px; padding:12px 15px; margin:10px 0; }
.step .t{ font-family:'Fredoka',sans-serif; font-weight:600; margin-bottom:3px; }
.step .b{ color:var(--ink-soft); }
.flash{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:13px 16px; cursor:pointer; margin:8px 0; }
.flash .f{ color:var(--excel-dark); font-weight:800; }
.flash .a{ display:none; margin-top:8px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:8px; }
.flash.open .a{ display:block; }
.hint{ font-size:.78rem; color:var(--ink-soft); opacity:.8; }
.gridwrap{ overflow-x:auto; }
.xgrid{ border-collapse:collapse; margin:14px 0; user-select:none; }
.xgrid th{ background:var(--excel-bg); min-width:44px; text-align:center; cursor:pointer; font-weight:600; }
.xgrid td{ min-width:44px; height:27px; text-align:center; cursor:pointer; background:var(--card); }
.xgrid td.sel, .xgrid th.sel{ background:var(--excel); color:#fff; }
.gridmsg{ font-size:.82rem; color:var(--excel-dark); font-weight:700; min-height:1.4em; margin-top:4px; }
.quiz .opt{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line);
  border-radius:8px; padding:9px 12px; margin:6px 0; cursor:pointer; font:inherit; font-weight:600; color:var(--ink); }
.quiz .opt.correct{ border-color:var(--excel); background:var(--excel-bg); }
.quiz .opt.wrong{ border-color:var(--sic); background:var(--sic-bg); }
.iconrow{ display:flex; flex-wrap:wrap; gap:14px; margin:14px 0 20px; }
.iconrow div{ text-align:center; font-size:1.9rem; width:76px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 4px 8px; }
.iconrow span{ display:block; font-size:.66rem; color:var(--ink-soft); margin-top:4px; font-weight:700; line-height:1.2; }
.chip-btn{ font:inherit; font-weight:700; font-size:.82rem; border:2px solid var(--excel); background:var(--card);
  color:var(--excel-dark); border-radius:999px; padding:7px 14px; cursor:pointer; }
.chip-btn.on{ background:var(--excel); color:#fff; }
.calc{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
.calc input{ width:56px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font:inherit; text-align:center; }
.calc select{ padding:6px 10px; border:1px solid var(--excel); border-radius:7px; font:inherit; font-weight:700; color:var(--excel-dark); background:var(--excel-bg); }
.fxicon{ font-style:italic; font-weight:800; color:var(--excel-dark); background:var(--excel-bg); border:1px solid var(--excel); border-radius:6px; padding:3px 8px; font-size:.85rem; }
.formulatext{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
.xgrid.mini th{ min-width:56px; } .xgrid.mini td{ padding:0; }
.xgrid.mini .calc-in{ width:100%; height:27px; border:none; background:transparent; text-align:center; font:inherit; font-weight:700; color:var(--ink); box-sizing:border-box; }
.xgrid.mini .calc-in:focus{ outline:2px solid var(--excel); }
.result-cell{ background:var(--excel); color:#fff; font-weight:800; text-align:center; }
.filterarrow{ cursor:pointer; color:var(--excel-dark); font-weight:800; margin-left:4px; padding:1px 5px; border-radius:4px; }
.filterarrow:hover{ background:var(--excel); color:#fff; }
.filterarrow.on{ background:var(--excel); color:#fff; }
details.practice{ background:var(--card); border:1px solid var(--line); border-radius:12px; margin:14px 0; overflow:hidden; }
details.practice summary{ cursor:pointer; padding:14px 18px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.05rem; background:var(--excel-bg); color:var(--excel-dark); list-style:none; }
details.practice summary::-webkit-details-marker{ display:none; }
details.practice summary::before{ content:'▸ '; }
details.practice[open] summary::before{ content:'▾ '; }
details.practice .inner{ padding:16px 18px 4px; }
.subnav{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 18px; }
.subnav button{ font:inherit; font-weight:700; font-size:.83rem; border:2px solid var(--excel); background:var(--excel-bg);
  color:var(--excel-dark); border-radius:999px; padding:7px 15px; cursor:pointer; }
.subnav button.active{ background:var(--excel); color:#fff; }
.xsec{ display:none; } .xsec.active{ display:block; animation:fade .2s ease; }
.bars{ display:flex; align-items:flex-end; gap:22px; height:130px; margin:14px 0 6px; padding:0 10px; }
.bars .bar{ flex:1; background:linear-gradient(180deg,var(--excel),var(--excel-dark)); border-radius:6px 6px 0 0; position:relative; min-width:40px; }
.bars .bar span{ position:absolute; top:-22px; left:0; right:0; text-align:center; font-weight:800; color:var(--excel-dark); font-size:.8rem;}
.bars .lbl2{ display:flex; gap:22px; padding:0 10px; }
.bars .lbl2 div{ flex:1; text-align:center; font-size:.78rem; color:var(--ink-soft); font-weight:700; min-width:40px; }
footer{ padding:20px 40px; color:var(--ink-soft); font-size:.75rem; border-top:1px solid var(--line); }
.credit{ font-weight:700; margin-bottom:10px; }
.logos-row{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
.logos-row img{ height:38px; width:auto; max-width:100%; }
.logos-row img:first-child{ height:34px; }
@media (max-width:720px){
  .app{ flex-direction:column; }
  nav{ position:relative; height:auto; width:100%; border-right:none; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px; }
  nav .brand{ width:100%; }
  nav button{ width:auto; }
  main{ padding:22px 18px 60px; }
}
</style>
</head>

const sections = [
{id:'base', title:'Fondamenti', color:C.base, html:`
  <span class="pill" style="background:var(--base-bg);color:var(--base)">📘 FONDAMENTI</span>
  <h2>Le basi della tecnologia dell'informazione</h2>
  <div class="card">🖥️ <b>Hardware</b> — la parte fisica del computer, ciò che si vede e si tocca: monitor, tastiera, mouse, CPU, RAM, SSD, stampante.</div>
  <div class="card">💾 <b>Software</b> — programmi e istruzioni che fanno funzionare il computer. Esempi: Windows, Word, Excel, Chrome.</div>
  <div class="card">⚙️ <b>CPU</b> — elabora le istruzioni e svolge le operazioni richieste.</div>
  <div class="card">⚡ <b>RAM</b> — memoria temporanea, usata per ciò che si sta facendo in questo momento.</div>
  <div class="card">🗄️ <b>SSD</b> — memoria di archiviazione che conserva file, documenti, immagini e programmi.</div>
  <div class="card">☁️ <b>Cloud</b> — spazio di archiviazione su server, accessibile tramite Internet.</div>
  <div class="card">⌨️ <b>Input</b> — informazioni che entrano nel computer (tastiera, mouse, microfono, scanner).<br>🖨️ <b>Output</b> — informazioni restituite dal computer (monitor, altoparlanti, stampante).</div>
  <div class="box ricorda"><span class="lbl">💡 RICORDA</span>Hardware = si tocca. Software = si usa sullo schermo.</div>
`},
{id:'sicurezza', title:'Sicurezza', color:C.sic, html:`
  <span class="pill" style="background:var(--sic-bg);color:var(--sic)">🔒 SICUREZZA INFORMATICA</span>
  <h2>Concetti di base</h2>
  <ul>
    <li>Non condividere le password con altre persone.</li>
    <li>Usa password robuste, diverse per servizi diversi.</li>
    <li>Fai attenzione a email, messaggi, link e allegati inattesi.</li>
    <li>Controlla sempre mittente e indirizzo email prima di fidarti.</li>
    <li>Non cliccare automaticamente sui link, non aprire allegati sospetti.</li>
    <li>Prima di agire, verifica che la richiesta sia autentica.</li>
  </ul>
  <div class="box importante"><span class="lbl">⚠️ IMPORTANTE — Phishing</span>Tentativo di ottenere dati riservati (password, dati personali) fingendosi un soggetto affidabile, es. una banca o un collega. Nel dubbio, non cliccare e chiedi conferma.</div>
`},
{id:'email', title:'Email', color:C.mail, html:`
  <span class="pill" style="background:var(--mail-bg);color:var(--mail)">✉️ EMAIL PROFESSIONALE</span>
  <h2>Scrivere un'email efficace</h2>
  <ul>
    <li>Controlla sempre il destinatario prima dell'invio.</li>
    <li>Scrivi un oggetto chiaro e specifico.</li>
    <li>Usa un tono educato, chiaro e professionale.</li>
    <li>Organizza il messaggio in modo breve e leggibile.</li>
    <li>Controlla ortografia e punteggiatura.</li>
    <li>Se parli di un allegato, verifica che sia realmente presente.</li>
  </ul>
  <div class="box ricorda"><span class="lbl">💡 RICORDA</span>Rileggi sempre il messaggio prima di cliccare <span class="chip" style="background:var(--mail-bg);color:var(--mail)">Invia</span>.</div>
`},
{id:'file', title:'File e cartelle', color:C.file, html:`
  <span class="pill" style="background:var(--file-bg);color:var(--file)">📁 FILE E CARTELLE</span>
  <h2>Organizzare i file</h2>
  <p>Una cartella organizza e conserva i file. Un file può essere di tipi diversi:</p>
  <div class="iconrow">
    <div>📄<span>Documento</span></div>
    <div>🖼️<span>Immagine</span></div>
    <div>📕<span>PDF</span></div>
    <div>📊<span>Foglio Excel</span></div>
    <div>📽️<span>Presentazione</span></div>
    <div>🎵<span>Audio</span></div>
    <div>🎬<span>Video</span></div>
    <div>📁<span>Cartella</span></div>
  </div>
  <div class="step"><div class="t">Creare una cartella</div><div class="b">Clic destro → <span class="chip" style="background:var(--file-bg);color:var(--file)">Nuovo</span> → Cartella → scrivi il nome → <kbd>Invio</kbd>.</div></div>
  <div class="step"><div class="t">Rinominare</div><div class="b">Clic destro → Rinomina → scrivi il nuovo nome → <kbd>Invio</kbd>.</div></div>
  <div class="step"><div class="t">Aprire</div><div class="b">Doppio clic sul file o sulla cartella.</div></div>
  <table><tr><th>Azione</th><th>Scorciatoia</th></tr>
  <tr><td>Copiare</td><td><kbd>CTRL</kbd>+<kbd>C</kbd></td></tr>
  <tr><td>Tagliare</td><td><kbd>CTRL</kbd>+<kbd>X</kbd></td></tr>
  <tr><td>Incollare</td><td><kbd>CTRL</kbd>+<kbd>V</kbd></td></tr>
  <tr><td>Annullare</td><td><kbd>CTRL</kbd>+<kbd>Z</kbd></td></tr>
  <tr><td>Selezionare tutto</td><td><kbd>CTRL</kbd>+<kbd>A</kbd></td></tr>
  </table>
  <h2>Selezionare più elementi</h2>
  <div class="step"><div class="t">Gruppo continuo</div><div class="b">Clicca il primo elemento → tieni premuto <kbd>SHIFT</kbd> → clicca l'ultimo.</div></div>
  <div class="step"><div class="t">Elementi separati</div><div class="b">Tieni premuto <kbd>CTRL</kbd> → clicca ogni elemento che vuoi selezionare.</div></div>
  <h2>Salvare un documento</h2>
  <div class="step"><div class="t">Salva con nome</div><div class="b"><span class="chip" style="background:var(--file-bg);color:var(--file)">File</span> → Salva con nome → scegli la cartella → scrivi il nome → Salva.</div></div>
  <div class="box ricorda"><span class="lbl">💡 RICORDA</span>L'icona a forma di floppy disk 💾 = Salva. <kbd>CTRL</kbd>+<kbd>S</kbd> salva velocemente le modifiche.</div>
  <h2>Che tipo di file è? — Le estensioni</h2>
  <p>L'estensione è la parte finale del nome del file (dopo il punto) e indica il suo tipo.</p>
  <table><tr><th>Estensione</th><th>Tipo</th></tr>
  <tr><td><code>.docx</code></td><td>📝 Documento Word</td></tr>
  <tr><td><code>.xlsx</code></td><td>📊 Cartella di lavoro Excel</td></tr>
  <tr><td><code>.pptx</code></td><td>📽️ Presentazione PowerPoint</td></tr>
  <tr><td><code>.pdf</code></td><td>📄 Documento PDF</td></tr>
  <tr><td><code>.jpg / .png</code></td><td>🖼️ Immagine</td></tr>
  <tr><td><code>.mp3</code></td><td>🎵 Audio</td></tr>
  <tr><td><code>.mp4</code></td><td>🎬 Video</td></tr>
  </table>
`},
{id:'word', title:'Word', color:C.word, html:`
  <span class="pill" style="background:var(--word-bg);color:var(--word)">📝 WORD</span>
  <h2>Documento e lettera</h2>
  <div class="step"><div class="t">Aprire un documento nuovo</div><div class="b">Apri Word → scegli Documento vuoto.</div></div>
  <div class="step"><div class="t">Formattare il testo</div><div class="b">Seleziona il testo → scheda <span class="chip" style="background:var(--word-bg);color:var(--word)">Home</span> → carattere, dimensione, grassetto, allineamento.</div></div>

  <div class="box importante"><span class="lbl">⚠️ IMPORTANTE</span>Prima di inviare una comunicazione ufficiale, controlla: ortografia, destinatario, allegati e contenuto.</div>
  <div class="box ricorda"><span class="lbl">💡 RICORDA</span>Salva con un nome chiaro, es. <code>Lettera_Clienti.docx</code></div>

const xsubs = [
{id:'struttura', title:'🧱 Struttura', html:`
  <h2>Struttura di Excel</h2>
  <ul>
    <li>Excel serve per organizzare, elaborare e rappresentare dati.</li>
    <li>Una cartella di lavoro può contenere più fogli.</li>
    <li>Le <b>colonne</b> sono lettere: A, B, C… — le <b>righe</b> sono numeri: 1, 2, 3…</li>
    <li>Una <b>cella</b> è l'incrocio tra colonna e riga, es. A1.</li>
    <li>La <b>cella attiva</b> è quella attualmente selezionata (bordo verde).</li>
  </ul>
  <div class="step"><div class="t">Selezionare una cella</div><div class="b">Clicca direttamente sulla cella, per esempio A1 → diventa la cella attiva.</div></div>
  <div class="step"><div class="t">Selezionare una colonna</div><div class="b">Clicca sulla lettera della colonna, per esempio <b>A</b>, in alto → si seleziona tutta la colonna.</div></div>
  <div class="step"><div class="t">Selezionare una riga</div><div class="b">Clicca sul numero della riga, per esempio <b>1</b>, a sinistra → si seleziona tutta la riga.</div></div>

  <div class="step"><div class="t">Selezionare tutto il foglio</div><div class="b">Clicca sul piccolo riquadro nell'angolo in alto a sinistra, tra lettere e numeri → oppure <kbd>CTRL</kbd>+<kbd>A</kbd>.</div></div>
  <div class="box prova"><span class="lbl">🖱️ PROVA TU</span>Clicca sulla griglia qui sotto: una cella, una lettera di colonna, un numero di riga, o l'angolo in alto a sinistra.</div>

  <h2>Formattare una tabella</h2>
  <div class="step"><div class="t">Grassetto per i titoli</div><div class="b">Seleziona le celle → <span class="chip" style="background:var(--excel-bg);color:var(--excel-dark)">Home</span> → <b>Grassetto</b>.</div></div>
  <div class="step"><div class="t">Allineare il contenuto</div><div class="b">Seleziona le celle → Home → Allineamento (sinistra, centro, destra).</div></div>
  <div class="step"><div class="t">Aggiungere bordi</div><div class="b">Seleziona le celle → Home → Bordi → scegli il tipo di bordo.</div></div>
  <div class="step"><div class="t">Colorare le celle</div><div class="b">Seleziona le celle → Home → Colore riempimento → scegli un colore.</div></div>
  <div class="step"><div class="t">Formato numero</div><div class="b">Seleziona le celle → Home → Formato numero → scegli Numero, Valuta, Percentuale o Data.</div></div>
  <div class="step"><div class="t">Larghezza colonna</div><div class="b">Trascina il bordo tra due lettere di colonna — oppure fai doppio clic sul bordo per adattarla automaticamente al contenuto.</div></div>
  <h3>Date e orari</h3>
  <ul>
    <li>Esempio di data: <code>25/09/2026</code> — esempio di orario: <code>09:00</code>.</li>
    <li>Per cambiare formato: seleziona le celle → Home → Numero → Data breve o Data estesa.</li>
    <li>Excel può ordinare le date dalla più vecchia alla più recente, o viceversa.</li>
  </ul>
  <h3>Formattazione condizionale</h3>
  <div class="step"><div class="t">Evidenziare automaticamente</div><div class="b">Seleziona le celle → Home → Formattazione condizionale → scegli una regola (es. "Maggiore di" o basata sul testo).</div></div>
`},
{id:'formule', title:'🧮 Formule', html:`
  <h2>Formule di base</h2>
  <div class="box ricorda"><span class="lbl">💡 REGOLA FONDAMENTALE</span>Una formula in Excel inizia sempre con <code>=</code></div>
  <p class="hint">Clicca ogni carta per vedere l'esempio.</p>
  <div id="flashcards"></div>
  <div class="step"><div class="t">Non serve memorizzare le formule</div><div class="b">Clicca sulla cella del risultato → clicca <span class="chip" style="background:var(--excel-bg);color:var(--excel-dark)">fx</span> (Inserisci funzione) → cerca la funzione, es. SOMMA o MEDIA → segui i campi proposti da Excel.</div></div>
  <div class="step"><div class="t">Somma automatica</div><div class="b">Clicca sulla cella sotto o accanto ai numeri → Home → <span class="chip" style="background:var(--excel-bg);color:var(--excel-dark)">Somma automatica (Σ)</span> → premi <kbd>Invio</kbd>.</div></div>
  <div class="step"><div class="t">Copiare una formula</div><div class="b">Seleziona la cella con la formula → posiziona il mouse sul piccolo quadratino in basso a destra della cella → trascina verso il basso: Excel adatta automaticamente i riferimenti alle nuove righe.</div></div>
  <div class="box prova"><span class="lbl">🖱️ PROVA TU</span>Questa è una vera mini-tabella Excel: cambia i numeri nella colonna D e guarda la cella del risultato aggiornarsi da sola, esattamente come farebbe una formula vera.</div>
  <div class="card">
    <div class="calc" style="margin-bottom:0">
      <span class="fxicon">fx</span>
      <select id="calc-fn" onchange="calcRun()"><option value="SOMMA">SOMMA</option><option value="MEDIA">MEDIA</option><option value="MAX">MAX</option><option value="MIN">MIN</option></select>
      <span class="formulatext" id="calc-formula">=SOMMA(D2:D5)</span>
    </div>
    <div class="gridwrap"><table class="xgrid mini">
      <tr><th class="corner"></th><th>D</th></tr>
      <tr><th>2</th><td><input type="number" class="calc-in" value="30" oninput="calcRun()"></td></tr>
      <tr><th>3</th><td><input type="number" class="calc-in" value="45" oninput="calcRun()"></td></tr>
      <tr><th>4</th><td><input type="number" class="calc-in" value="60" oninput="calcRun()"></td></tr>
      <tr><th>5</th><td><input type="number" class="calc-in" value="30" oninput="calcRun()"></td></tr>
      <tr><th>6</th><td class="result-cell" id="calc-out">165</td></tr>
    </table></div>
  </div>
`},
{id:'ordinare', title:'🔀 Ordinare e filtrare', html:`
  <h2>Ordinare i dati</h2>
  <div class="step"><div class="t">Ordinare la tabella</div><div class="b">Clicca dentro la tabella → <span class="chip" style="background:var(--excel-bg);color:var(--excel-dark)">Dati</span> → <b>Ordina</b> → scegli la colonna (es. Cognome, Città o Data) → scegli A-Z, Z-A o dalla più vecchia alla più recente.</div></div>
  <div class="box importante"><span class="lbl">⚠️ IMPORTANTE</span>Ordina sempre l'intera tabella, così i dati di ogni riga restano associati correttamente.</div>
  <h2>Filtrare i dati</h2>
  <div class="step"><div class="t">Creare un filtro</div><div class="b">Clicca dentro la tabella → <span class="chip" style="background:var(--excel-bg);color:var(--excel-dark)">Dati</span> → <b>Filtro</b> → usa la freccia che appare nell'intestazione della colonna → scegli il dato da visualizzare.</div></div>
  <div class="step"><div class="t">Togliere il filtro</div><div class="b">Clicca di nuovo la freccia → scegli "Cancella filtro" per tornare alla vista completa.</div></div>
  <p class="hint">Questa è una vera tabella in stile Excel — clicca le frecce ▾ nell'intestazione per ordinare o filtrare, esattamente come nel programma vero:</p>
  <div class="card">
    <div class="gridwrap"><table class="xgrid" id="reg-table">
      <tr><th class="corner"></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th></tr>
      <tr><th>1</th><th style="text-align:left;padding-left:8px">Data <span class="filterarrow" onclick="regSort('data')">▾</span></th><th style="text-align:left;padding-left:8px">Ora</th><th style="text-align:left;padding-left:8px">Nome</th><th style="text-align:left;padding-left:8px">Cognome <span class="filterarrow" onclick="regSort('cognome')">▾</span></th><th style="text-align:left;padding-left:8px">Motivo</th><th style="text-align:left;padding-left:8px">Stato <span class="filterarrow" id="reg-filter-arrow" onclick="regFilter()">▾</span></th></tr>
      <tbody id="reg-body"></tbody>
    </table></div>
    <p class="hint">🔁 <a href="#" onclick="regReset();return false;" style="color:var(--excel-dark);font-weight:700">Ripristina tabella</a></p>
  </div>
  <div class="box prova"><span class="lbl">🖱️ PROVA TU</span>Clicca la freccia accanto a "Stato" — dovrebbero restare solo Anna Rossi e Giulia Verdi. Poi clicca la freccia accanto a "Cognome" per ordinarli alfabeticamente.</div>
`},
{id:'grafici', title:'📈 Grafici', html:`
  <h2>Creare un grafico in Excel</h2>
  <p>Un grafico trasforma i numeri di una tabella in un'immagine facile da leggere a colpo d'occhio.</p>
  <div class="step"><div class="t">1 · Selezionare i dati</div><div class="b">Seleziona la tabella, incluse le intestazioni (es. i nomi delle categorie e i numeri corrispondenti).</div></div>
  <div class="step"><div class="t">2 · Inserire il grafico</div><div class="b">Vai su <span class="chip" style="background:var(--excel-bg);color:var(--excel-dark)">Inserisci</span> → <b>Grafici</b> → scegli il tipo di grafico.</div></div>
  <h3>Quale tipo scegliere?</h3>
  <table><tr><th>Tipo</th><th>Quando usarlo</th></tr>
  <tr><td>📊 A colonne / a barre</td><td>Per confrontare quantità tra categorie diverse (es. persone, giorni, prodotti).</td></tr>
  <tr><td>📈 A linee</td><td>Per mostrare come un valore cambia nel tempo (es. vendite mese per mese).</td></tr>
  <tr><td>🥧 A torta</td><td>Per mostrare come un totale si divide in parti (es. percentuali).</td></tr>
  </table>
  <p class="hint">Esempio — appuntamenti per tipo di motivo. Ogni colonna è una categoria diversa (asse orizzontale); l'altezza mostra quanti appuntamenti ci sono per quella categoria (asse verticale):</p>
  <div class="bars">
    <div class="bar" style="height:100%"><span>3</span></div>
    <div class="bar" style="height:67%"><span>2</span></div>
    <div class="bar" style="height:33%"><span>1</span></div>
  </div>
  <div class="bars lbl2"><div>Colloquio</div><div>Consulenza</div><div>Riunione</div></div>
  <div class="step"><div class="t">3 · Modificare il titolo del grafico</div><div class="b">Fai doppio clic sul titolo del grafico → scrivi un titolo chiaro, es. "Appuntamenti per motivo".</div></div>
  <div class="step"><div class="t">4 · Spostare o ridimensionare</div><div class="b">Clicca il bordo del grafico e trascina per spostarlo — trascina un angolo per ridimensionarlo.</div></div>
  <div class="box ricorda"><span class="lbl">💡 RICORDA</span>Se cambi i numeri nella tabella di origine, il grafico si aggiorna automaticamente da solo.</div>
`},

const formulas = [
  {f:'Moltiplicazione', ex:'=B2*C2', a:"Moltiplica il valore della cella B2 per il valore della cella C2."},
  {f:'SOMMA', ex:'=SOMMA(D2:D11)', a:"Somma tutti i valori nell'intervallo da D2 a D11."},
  {f:'MEDIA', ex:'=MEDIA(C2:C11)', a:"Calcola il valore medio dell'intervallo."},
  {f:'MAX', ex:'=MAX(C2:C11)', a:"Trova il valore più alto dell'intervallo."},
  {f:'MIN', ex:'=MIN(C2:C11)', a:"Trova il valore più basso dell'intervallo."},
  {f:'CONTA.NUMERI', ex:'=CONTA.NUMERI(B2:B11)', a:"Conta quante celle dell'intervallo contengono numeri."}
];

const nav = document.getElementById('nav');
const main = document.getElementById('main');

sections.forEach(s=>{
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.title}`;
  btn.dataset.id = s.id;
  btn.onclick = ()=> show(s.id);
  nav.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'section';
  div.id = 'sec-'+s.id;
  div.innerHTML = s.html;
  main.appendChild(div);
});

function show(id){
  document.querySelectorAll('.section').forEach(d=>d.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>{ b.classList.remove('active'); b.style.background=''; b.style.color=''; });
  document.getElementById('sec-'+id).classList.add('active');
  const activeBtn = document.querySelector('nav button[data-id="'+id+'"]');
  activeBtn.classList.add('active');
  const s = sections.find(x=>x.id===id);
  activeBtn.style.background = s.color; activeBtn.style.color = '#fff';
  window.scrollTo({top:0,behavior:'instant'});
}

// Excel subnav + subsections
const xsubnav = document.getElementById('xsubnav');
const xcontainer = document.getElementById('xcontainer');
xsubs.forEach(x=>{
  const b = document.createElement('button');
  b.textContent = x.title;
  b.dataset.xid = x.id;
  b.onclick = ()=> showX(x.id);
  xsubnav.appendChild(b);
  const d = document.createElement('div');
  d.className='xsec'; d.id='xsec-'+x.id; d.innerHTML = x.html;
  xcontainer.appendChild(d);
});
function showX(id){
  document.querySelectorAll('.xsec').forEach(d=>d.classList.remove('active'));
  document.querySelectorAll('#xsubnav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('xsec-'+id).classList.add('active');
  document.querySelector('#xsubnav button[data-xid="'+id+'"]').classList.add('active');
}

// flashcards (in formule subsection)
const fcbox = document.getElementById('flashcards');
formulas.forEach(f=>{
  const d = document.createElement('div');
  d.className='flash';
  d.innerHTML = `<span class="f">${f.f}</span> &nbsp;<span class="hint">clicca per l'esempio</span>
    <div class="a"><code>${f.ex}</code><br>${f.a}</div>`;
  d.onclick = ()=> d.classList.toggle('open');
  fcbox.appendChild(d);
});

// excel grid simulator
(function(){
  const cols = ['A','B','C','D','E'];
  const rows = [1,2,3,4,5];
  const g = document.getElementById('xg');
  const msg = document.getElementById('xgmsg');
  let head = '<tr><th class="corner" id="corner">⌷</th>';
  cols.forEach(c=> head += `<th data-col="${c}">${c}</th>`);
  head += '</tr>';
  g.innerHTML = head;
  rows.forEach(r=>{
    let tr = document.createElement('tr');
    tr.innerHTML = `<th data-row="${r}">${r}</th>` + cols.map(c=>`<td data-cell="${c}${r}"></td>`).join('');
    g.appendChild(tr);
  });
  function clearSel(){ g.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel')); }
  g.addEventListener('click', e=>{
    const t = e.target;
    if(t.id==='corner'){ clearSel(); g.querySelectorAll('td,th[data-col],th[data-row]').forEach(e=>e.classList.add('sel'));
      msg.textContent = 'Intero foglio selezionato — come CTRL+A.'; return; }
    if(t.dataset.col){ clearSel(); g.querySelectorAll(`[data-cell^="${t.dataset.col}"]`).forEach(e=>e.classList.add('sel'));
      t.classList.add('sel'); msg.textContent = `Colonna ${t.dataset.col} selezionata.`; return; }
    if(t.dataset.row){ clearSel();
      g.querySelectorAll('[data-cell]').forEach(e=>{ if(e.dataset.cell.slice(1)===t.dataset.row) e.classList.add('sel'); });
      t.classList.add('sel'); msg.textContent = `Riga ${t.dataset.row} selezionata.`; return; }
    if(t.dataset.cell){ clearSel(); t.classList.add('sel'); msg.textContent = `Cella attiva: ${t.dataset.cell}`; return; }
  });
})();

// interactive registro (Ordinare e filtrare)
let regRows = [
  {data:'03/10/2026', ora:'10:00', nome:'Anna', cognome:'Rossi', motivo:'Colloquio', stato:'Confermato'},
  {data:'03/10/2026', ora:'15:30', nome:'Marco', cognome:'Bianchi', motivo:'Consulenza', stato:'Da confermare'},
  {data:'04/10/2026', ora:'09:00', nome:'Giulia', cognome:'Verdi', motivo:'Riunione', stato:'Confermato'},
  {data:'04/10/2026', ora:'11:00', nome:'Luca', cognome:'Neri', motivo:'Colloquio', stato:'Annullato'}
];
let regFilterOn = false;
function regRender(){
  const body = document.getElementById('reg-body');
  if(!body) return;
  const rows = regFilterOn ? regRows.filter(r=>r.stato==='Confermato') : regRows;
  body.innerHTML = rows.map((r,i)=>`<tr><th>${i+2}</th><td>${r.data}</td><td>${r.ora}</td><td>${r.nome}</td><td>${r.cognome}</td><td>${r.motivo}</td><td>${r.stato}</td></tr>`).join('');
}
function regSort(field){ regRows = regRows.slice().sort((a,b)=> a[field]>b[field] ? 1 : -1); regRender(); }
function regFilter(){ regFilterOn = !regFilterOn;
  document.getElementById('reg-filter-arrow').classList.toggle('on', regFilterOn); regRender(); }
function regReset(){ regFilterOn = false;
  const arrow = document.getElementById('reg-filter-arrow'); if(arrow) arrow.classList.remove('on');
  regRows = [
    {data:'03/10/2026', ora:'10:00', nome:'Anna', cognome:'Rossi', motivo:'Colloquio', stato:'Confermato'},
    {data:'03/10/2026', ora:'15:30', nome:'Marco', cognome:'Bianchi', motivo:'Consulenza', stato:'Da confermare'},
    {data:'04/10/2026', ora:'09:00', nome:'Giulia', cognome:'Verdi', motivo:'Riunione', stato:'Confermato'},
    {data:'04/10/2026', ora:'11:00', nome:'Luca', cognome:'Neri', motivo:'Colloquio', stato:'Annullato'}
  ];
  regRender(); }
regRender();

// interactive formula calculator (Formule)
function calcRun(){
  const fn = document.getElementById('calc-fn');
  const out = document.getElementById('calc-out');
  const ft = document.getElementById('calc-formula');
  if(!fn) return;
  const vals = Array.from(document.querySelectorAll('.calc-in')).map(i=> parseFloat(i.value) || 0);
  let result;
  if(fn.value==='SOMMA') result = vals.reduce((a,b)=>a+b,0);
  else if(fn.value==='MEDIA') result = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  else if(fn.value==='MAX') result = Math.max(...vals);
  else result = Math.min(...vals);
  out.textContent = result;
  ft.textContent = `=${fn.value}(D2:D5)`;
}
calcRun();

show('base');
showX('struttura');
</script>
</body>
</html>
